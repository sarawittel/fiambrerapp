# Proyecto Xcode generado con XcodeGen:  xcodegen generate
name: GK2Guia
options:
  bundleIdPrefix: local.gk2guia
  deploymentTarget:
    iOS: "17.0"
packages:
  GK2Core:
    path: Packages/GK2Core
targets:
  GK2Guia:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: GK2Guia
    dependencies:
      - package: GK2Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.gk2guia.app
        PRODUCT_NAME: GK2Guia
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fiambrera
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        # Elige tu equipo en Xcode para firmar.
        SWIFT_VERSION: "5.0"
